[package]
name = "opentranscribe-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "opentranscribe_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "opentranscribe"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
atomic-write-file = "0.3.0"
chrono.workspace = true
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
hex = "0.4.3"
hound = "3.5.1"
keyring = "4.1.5"
log = "0.4.29"
opentranscribe-domain = { path = "../crates/domain" }
opentranscribe-transcriber-protocol = { path = "../crates/transcriber-protocol" }
rusqlite = { version = "0.39.0", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
symphonia = { version = "0.6.0", features = ["all"] }
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
tempfile = "3.27.0"
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10.0"
