repos:
  - repo: local
    hooks:
      - id: lint-code
        name: Ruff Lint
        entry: bash -c "uv run ruff check --fix"
        language: system
        types: [ python ]
        pass_filenames: false

      - id: format-code
        name: Ruff Format
        entry: bash -c "uv run ruff format"
        language: system
        types: [ python ]
        pass_filenames: false

      - id: sort-imports
        name: Sort Imports
        entry: bash -c "uv run isort ."
        language: system
        types: [ python ]
        pass_filenames: false

      - id: setup-all-agents
        name: Setup All Agents
        entry: bash -c "task ai:setup"
        language: system
        pass_filenames: false
