name: Test

on:
  workflow_call:
    inputs:
      frontend:
        description: Run frontend and browser contract tests
        required: false
        type: boolean
        default: true
      native:
        description: Run native contract tests on every supported operating system
        required: false
        type: boolean
        default: true
      native_os:
        description: Native operating system to test, or all supported operating systems
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      frontend:
        description: Run frontend and browser contract tests
        required: false
        type: boolean
        default: true
      native:
        description: Run native contract tests on every supported operating system
        required: false
        type: boolean
        default: true
      native_os:
        description: Native operating system to test
        required: false
        type: choice
        default: all
        options:
          - all
          - macos-latest
          - windows-latest
          - ubuntu-24.04

permissions:
  contents: read

jobs:
  frontend:
    if: inputs.frontend
    name: Frontend and browser contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Run frontend tests
        run: npm run test
        working-directory: apps/desktop

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop

      - name: Run workspace smoke test
        run: npm run test:ui
        working-directory: apps/desktop

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore

      - name: Audit frontend dependencies
        run: npm audit
        working-directory: apps/desktop

  native:
    if: inputs.native
    name: Native contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            inputs.native_os == 'macos-latest' && '["macos-latest"]' ||
            inputs.native_os == 'windows-latest' && '["windows-latest"]' ||
            inputs.native_os == 'ubuntu-24.04' && '["ubuntu-24.04"]' ||
            '["macos-latest","windows-latest","ubuntu-24.04"]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libappindicator3-dev libasound2-dev libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Prepare local transcription sidecar
        run: npm run prepare:sidecar:debug
        working-directory: apps/desktop

      - name: Run native and sidecar tests
        run: cargo test --workspace --locked
