name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yaml

  test:
    uses: ./.github/workflows/test.yaml

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate tagged version
        run: node scripts/verify-release-version.mjs

  build:
    needs: [quality, test, validate]
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libappindicator3-dev libasound2-dev libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      # macOS signing stays optional so tagged builds keep working before the
      # Developer ID credentials exist. Windows and Linux installers are
      # always unsigned; only macOS binds capture permissions and Keychain
      # entries to a signing identity.
      - name: Resolve signing mode
        id: signing
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "release_body=macOS installers are signed and notarized. Windows and Linux installers are unsigned." >>"$GITHUB_OUTPUT"
          else
            echo "release_body=Installers are unsigned preview artifacts until platform signing is configured." >>"$GITHUB_OUTPUT"
          fi

          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "sign_args=" >>"$GITHUB_OUTPUT"
            echo "macos_signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "sign_args=--no-sign" >>"$GITHUB_OUTPUT"
            echo "macos_signed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Build draft installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: OpenTranscribe v__VERSION__
          releaseBody: ${{ steps.signing.outputs.release_body }}
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci ${{ steps.signing.outputs.sign_args }} -- --locked

      # tauri-action already fails the build when signing or notarization
      # fails. Missing entitlements do not fail the build, so verify them
      # here rather than discovering silent microphone denial after release.
      - name: Verify signed macOS bundle
        if: steps.signing.outputs.macos_signed == 'true'
        run: npm run verify:signing:macos -- ../../target/${{ matrix.target }}/release/bundle/macos/OpenTranscribe.app
        working-directory: apps/desktop
