name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate tagged version
        run: node scripts/verify-release-version.mjs

      # Only a semver pre-release suffix marks a release as a pre-release.
      # Stable tags publish as full releases so the updater endpoint at
      # releases/latest keeps resolving to the newest build.
      - name: Resolve release identity
        id: release
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libappindicator3-dev libasound2-dev libclang-dev libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      # macOS signing stays optional so tagged builds keep working before the
      # Developer ID credentials exist. Windows and Linux installers are always
      # unsigned; only macOS binds capture permissions and Keychain entries to a
      # signing identity.
      #
      # `--no-sign` also suppresses updater signatures on every platform, so it
      # is passed only when no updater key is configured. Tauri already skips
      # macOS code signing on its own when no identity is available.
      - name: Resolve build mode
        id: mode
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          OPENTRANSCRIBE_UPDATER_PUBLIC_KEY: ${{ vars.OPENTRANSCRIBE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          macos_signed=false
          updater_enabled=false
          sign_args=
          updater_args=

          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            macos_signed=true
          fi

          if [ -n "$OPENTRANSCRIBE_UPDATER_PUBLIC_KEY" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater_enabled=true
            updater_args="--config src-tauri/tauri.updater.conf.json"
          elif [ "$RUNNER_OS" = "macOS" ] && [ "$macos_signed" = false ]; then
            sign_args=--no-sign
          fi

          {
            echo "macos_signed=$macos_signed"
            echo "sign_args=$sign_args"
            echo "updater_args=$updater_args"
            echo "updater_enabled=$updater_enabled"
          } >>"$GITHUB_OUTPUT"

      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENTRANSCRIBE_UPDATER_PUBLIC_KEY: ${{ vars.OPENTRANSCRIBE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci ${{ steps.mode.outputs.sign_args }} ${{ steps.mode.outputs.updater_args }} -- --locked

      - name: Verify Linux GLIBC baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          node scripts/verify-linux-glibc.mjs 2.35
          target/${{ matrix.target }}/release/opentranscribe
          apps/desktop/src-tauri/binaries/local-transcriber-${{ matrix.target }}

      # Tauri fails the build when signing or notarization fails. Missing
      # entitlements do not fail the build, so verify them here instead.
      - name: Verify signed macOS bundle
        if: steps.mode.outputs.macos_signed == 'true'
        run: npm run verify:signing:macos -- ../../target/${{ matrix.target }}/release/bundle/macos/OpenTranscribe.app
        working-directory: apps/desktop

      # Both macOS targets bundle an architecture-less OpenTranscribe.app.tar.gz,
      # so the updater payload is renamed per target before the assets from every
      # build job are merged into one release. The AppImage and NSIS payloads have
      # a single producing target each and keep their published names.
      - name: Name macOS updater payloads by target
        if: runner.os == 'macOS' && steps.mode.outputs.updater_enabled == 'true'
        shell: bash
        run: |
          while IFS= read -r -d '' asset; do
            renamed="${asset%.app.tar.gz}.${{ matrix.target }}.app.tar.gz"
            mv "$asset" "$renamed"

            if [ -f "$asset.sig" ]; then
              mv "$asset.sig" "$renamed.sig"
            fi
          done < <(
            find "target/${{ matrix.target }}/release/bundle" -type f -name '*.app.tar.gz' -print0
          )

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Each build job's artifact arrives unpacked, so the installers are
      # ordinary files here rather than nested zips.
      - name: Download installers from every build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-assets-*
          path: release-assets

      - name: Verify every target produced installers
        run: node scripts/verify-release-assets.mjs release-assets

      - name: Create updater manifest
        env:
          OPENTRANSCRIBE_UPDATER_PUBLIC_KEY: ${{ vars.OPENTRANSCRIBE_UPDATER_PUBLIC_KEY }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$OPENTRANSCRIBE_UPDATER_PUBLIC_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            exit 0
          fi

          if node scripts/create-updater-manifest.mjs \
            --assets-directory release-assets \
            --output release-assets/latest.json \
            --release-tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION"; then
            exit 0
          fi

          # Installers still ship. Publishing partial updater metadata would
          # offer some platforms an update the others cannot verify.
          rm -f release-assets/latest.json
          echo "::warning::Updater metadata is incomplete; publishing installers without latest.json."

      - name: Publish GitHub release
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mapfile -d '' release_assets < <(
            find release-assets -type f \( \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.msi' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.tar.gz' -o \
              -name '*.sig' -o \
              -name 'latest.json' \
            \) -print0
          )

          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            notes="macOS installers are signed and notarized. Windows and Linux installers are unsigned."
          else
            notes="Installers are unsigned preview artifacts until platform signing is configured."
          fi

          # The release starts as a draft and is published only once every
          # installer is attached, so it is never visible half-populated.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "OpenTranscribe v$RELEASE_VERSION" \
              --notes "$notes"
          fi

          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber

          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease="$RELEASE_PRERELEASE"

          echo "::notice::Published https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG"
