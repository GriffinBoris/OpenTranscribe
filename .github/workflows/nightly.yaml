name: Nightly

on:
  # Bundling every supported target nightly catches a broken installer before a
  # tag is pushed, instead of during the release itself.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yaml

  test:
    uses: ./.github/workflows/test.yaml

  native:
    needs: [quality, test]
    uses: ./.github/workflows/native-build.yaml
    with:
      bundle: true
