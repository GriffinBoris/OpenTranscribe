name: Native Compile

on:
  workflow_call:
    inputs:
      bundle:
        description: Build and retain unsigned installers instead of compile-only checks
        required: false
        type: boolean
        default: false
      target:
        description: Native target to compile, or all supported targets
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      bundle:
        description: Build and retain unsigned installers
        required: false
        type: boolean
        default: false
      target:
        description: Native target to compile
        required: false
        type: choice
        default: all
        options:
          - all
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.target == 'aarch64-apple-darwin' && '[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"}]' ||
            inputs.target == 'x86_64-apple-darwin' && '[{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"}]' ||
            inputs.target == 'x86_64-pc-windows-msvc' && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"}]' ||
            inputs.target == 'x86_64-unknown-linux-gnu' && '[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage,deb"}]' ||
            '[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage,deb"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: ${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libappindicator3-dev libasound2-dev libclang-dev libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build frontend
        if: inputs.bundle != true
        run: npm run build
        working-directory: apps/desktop

      - name: Prepare local transcription sidecar
        if: inputs.bundle != true
        run: npm run prepare:sidecar:debug -- --target ${{ matrix.target }}
        working-directory: apps/desktop

      - name: Compile native workspace
        if: inputs.bundle != true
        run: cargo check --workspace --locked --target ${{ matrix.target }}

      - name: Build unsigned installers
        if: inputs.bundle
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci --no-sign -- --locked
        working-directory: apps/desktop

      - name: Verify Linux GLIBC baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          node scripts/verify-linux-glibc.mjs 2.35
          target/${{ matrix.target }}/release/opentranscribe
          apps/desktop/src-tauri/binaries/local-transcriber-${{ matrix.target }}

      - name: Upload unsigned installers
        if: inputs.bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opentranscribe-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 7
