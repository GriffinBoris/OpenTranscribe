name: Quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate generated agent guidance
        run: |
          python3 agents/build_agents.py --target opencode --out . --layout in-place
          python3 agents/build_agents.py --target claude --out . --layout in-place
          python3 agents/build_agents.py --target copilot --out . --layout in-place
          python3 agents/build_agents.py --target codex --out . --layout in-place
          python3 agents/build_agents.py --target gemini --out . --layout in-place
          git diff --exit-code

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Verify Tauri frontend and native versions
        run: node scripts/verify-tauri-versions.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: ubuntu-22.04-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libappindicator3-dev libasound2-dev libclang-dev libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Prepare local transcription sidecar
        run: npm run prepare:sidecar:debug
        working-directory: apps/desktop

      - name: Check installer
        run: |
          bash -n scripts/install.sh
          python3 -m unittest discover -s scripts/tests

      - name: Verify generated domain contracts
        run: |
          npm run types:generate
          test -z "$(git status --porcelain --untracked-files=all -- src/types/generated)"
        working-directory: apps/desktop

      - name: Check formatting
        run: |
          npm run format:check
          cargo fmt --all --check
        working-directory: apps/desktop

      - name: Lint frontend
        run: npm run lint
        working-directory: apps/desktop

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Type-check frontend
        run: npm run typecheck
        working-directory: apps/desktop

      - name: Ensure quality checks did not modify files
        run: git diff --exit-code
