name: Quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate generated agent guidance
        run: |
          python3 agents/build_agents.py --target opencode --out . --layout in-place
          python3 agents/build_agents.py --target claude --out . --layout in-place
          python3 agents/build_agents.py --target copilot --out . --layout in-place
          python3 agents/build_agents.py --target codex --out . --layout in-place
          python3 agents/build_agents.py --target gemini --out . --layout in-place
          git diff --exit-code

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libappindicator3-dev libasound2-dev libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare local transcription sidecar
        run: npm run prepare:sidecar:debug

      - name: Check formatting
        run: |
          npm run format:check
          cargo fmt --all --check

      - name: Lint frontend
        run: npm run lint

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Ensure quality checks did not modify files
        run: git diff --exit-code
