[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/transcriber-protocol",
    "sidecars/local-transcriber",
    "sidecars/text-normalizer",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.12"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.45", features = ["serde"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl"] }
ulid = { version = "3.0.0", features = ["serde"] }
